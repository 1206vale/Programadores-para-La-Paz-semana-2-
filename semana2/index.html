<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Participa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section class="contenedor">
      <h1>Reporta problemas y mejora tu entorno digital.</h1>

      <p>
        
El objetivo de este formulario es permitir que las personas reporten problemas reales en internet (spam, desinformación, acoso) y propongan soluciones.

      </p>

      <form>
        <div class="campo">
          <label for="nombre">Nombre y apellido del participante:</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            placeholder="Escribe tu nombre completo">
        </div>

        <div class="campo">
          <label for="propuesta">Tu aporte para mejorar la comunidad digital:</label>
          <textarea 
            id="propuesta" 
            name="propuesta" 
            placeholder="Describe el problema identificado y tu propuesta de solución."></textarea>
        </div>

        <div class="campo">
          <label for="contacto">Correo electrónico o teléfono de contacto (opcional):</label>
          <input 
            type="text" 
            id="contacto" 
            name="contacto" 
            placeholder="Este campo es opcional">
        </div>

        <div class="campo">
          <label>
            <input type="checkbox" name="consentimiento">
          Autorizo el uso de mi información solo para actividades relacionadas con la participación comunitaria.
          </label>
        </div>

        <button type="submit">
          Registrar participación 
          </button>
      </form>
    </section>
  </main>

</body>
</html>
