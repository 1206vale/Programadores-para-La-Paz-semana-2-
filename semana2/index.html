<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Participa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section class="contenedor">
      <h1>La voz de una comunidad participativa</h1>

      <p>
        Este formulario permite recoger propuestas, ideas o necesidades que creas que pueda tener la comunidad, para que así se pueda organizar y llevar a cabo.
        La información será usada únicamente con fines de participación y organización comunitaria.
      </p>

      <form>
        <div class="campo">
          <label for="nombre">Nombre del creador de la propuesta</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            placeholder="Escribe tu nombre y apellido">
        </div>

        <div class="campo">
          <label for="propuesta">Propuesta, idea o necesidad</label>
          <textarea 
            id="propuesta" 
            name="propuesta" 
            placeholder="Escribe las propuestas, ideas o necesidades que creas que pueda tener la comunidad"></textarea>
        </div>

        <div class="campo">
          <label for="contacto">Numero de telefono o forma en la que podemos contactarte (opcional)</label>
          <input 
            type="text" 
            id="contacto" 
            name="contacto" 
            placeholder="Escribe el numero de telefono o la forma en la que podemos contactarte (opcional)">
        </div>

        <div class="campo">
          <label>
            <input type="checkbox" name="consentimiento">
            Acepto que mi información sea usada únicamente para fines de participación y mejoramiento de la comunidad.
          </label>
        </div>

        <button type="submit">Enviar mi participación</button>
      </form>
    </section>
  </main>

</body>
</html>
