<!DOCTYPE html>
<html lang="spanish">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saber de ti</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section class="contenedor">
      <h1>saber de ti</h1>

      <p>
        Este espacio es para generar un conocimiento conjunto de como podemos saber quien eres cual es tu genero, tu edad, tu estado civil, tu nivel de estudios, todo aquello que nos permita ser mas amigos 
      </p>

      <form>
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            placeholder="Escribe tu nombre">
        </div>

        <div class="campo">
          <label for="propuesta">Propuesta o mensaje</label>
          <textarea 
            id="propuesta" 
            name="propuesta" 
            placeholder="Escribe tu propuesta para la comunidad"></textarea>
        </div>

        <div class="campo">
          <label for="contacto">Correo o teléfono de contacto opcional</label>
          <input 
            type="text" 
            id="contacto" 
            name="contacto" 
            placeholder="Este campo es opcional">
        </div>

        <div class="campo">
          <label>
            <input type="checkbox" name="consentimiento">
            Acepto y permito que mi información sea usada para fines de participación comunitaria, permitiendo foriticar un ideal ciudadno para beneficio general.
          </label>
        </div>

        <button type="submit">Enviar participación</button>
      </form>
    </section>
  </main>

</body>
</html>
