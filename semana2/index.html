<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Participa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section class="contenedor">
      <h1>Participa por una Comunidad Informada y Responsable</h1>

      <p>
        Este formulario tiene como propósito recoger propuestas, opiniones y alertas de la comunidad relacionadas con la convivencia, 
        el uso responsable de la información y la prevención de la desinformación. 
      </p>

      <form>
        <div class="campo">
          <label for="nombre">Nombre del Participante</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            placeholder="Escribe tu nombre">
        </div>

        <div class="campo">
          <label for="propuesta">Propuesta, Opinión o Alerta</label>
          <textarea 
            id="propuesta" 
            name="propuesta" 
            placeholder="Escribe tu propuesta para la comunidad (Puedes compartir ideas, reportar información falsa, o dar tu opinión sobre el uso de redes sociales)"></textarea>
        </div>

        <div class="campo">
          <label for="contacto">Correo o teléfono de contacto (opcional)</label>
          <input 
            type="text" 
            id="contacto" 
            name="contacto" 
            placeholder="Este campo es opcional">
        </div>

        <div class="campo">
          <label>
            <input type="checkbox" name="consentimiento">
            Acepto el uso de mis datos para participación comunitaria y promoción del uso responsable de la información.
          </label>
        </div>

        <button type="submit">Enviar participación</button>
      </form>
    </section>
  </main>

</body>
</html>
