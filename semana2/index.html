<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Participa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section class="contenedor">
      <h1>Formulario Participa</h1>

      <p>
        Este formulario permite recoger propuestas, ideas o necesidades de la comunidad.
        La información será usada únicamente con fines de participación y organización comunitaria.
      </p>

      <form>
        
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            placeholder="Ej: karen-martinez
            required>
        </div>

        <div class="campo">
          <label for="propuesta">Propuesta o mensaje</label>
          <textarea 
            id="propuesta" 
            name="propuesta" 
            placeholder="Escribe tu propuesta para la comunidad"
            Crear jornadas mensuales de limpieza y reciclaje en el barrio,
            donde los vecinos participen activamente en el cuidado del entorno. Además, 
            implementar puntos de recolección de residuos reciclables y realizar talleres educativos sobre
            el manejo adecuado de la basura y el cuidado del medio ambiente.
            required></textarea>
        </div>

        <div class="campo">
          <label for="contacto">Correo electrónico karenmartinez3128@gmai.com (opcional)</label>
          <input 
            type="email" 
            id="contacto" 
            name="contacto" 
            placeholder="ejemplo@correo.com">
        </div>

        <div class="campo">
          <label>
            <input type="checkbox" name="consentimiento" required>
            Acepto que mi información sea usada únicamente para fines de participación comunitaria.
          </label>
        </div>

        <button type="submit">Enviar participación</button>

      </form>
    </section>
  </main>

</body>
</html>
